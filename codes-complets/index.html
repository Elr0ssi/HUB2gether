<html lang="fr">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root { --bg:#f3f6f8; --panel:#fff; --line:#dbe4ed; --text:#0f172a; --muted:#64748b; --mint:#77e0b3; --mint-dark:#0f9f6c; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
    a{text-decoration:none;color:inherit}
    .shell{max-width:1200px;margin:0 auto;padding:20px}
    .top{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .top-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
    .brand{font-weight:800;display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:10px;background:#e7fbf2;display:grid;place-items:center;color:var(--mint-dark)}
    .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
    .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
    .btn.primary{background:#111827;color:#d1fae5;border-color:#111827}

    .hero{padding:56px 0 34px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}
    .kicker{display:inline-flex;background:#dcfce7;color:#107a54;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}

    .hero p{color:var(--muted);font-size:18px;line-height:1.7;margin:0}
    .hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .mock{background:linear-gradient(160deg,#0f172a,#1e293b);color:#dbeafe;border-radius:24px;padding:20px;border:1px solid #1f2937;box-shadow:0 20px 50px rgba(15,23,42,.2)}
    .mock h3{margin:0 0 14px;color:#7fe3b3}
    .mock-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .pill{border:1px solid rgba(219,234,254,.2);border-radius:12px;padding:10px;font-size:13px}

    .section-title{font-size:30px;margin:8px 0 6px;letter-spacing:-.02em}
    .section-sub{color:var(--muted);margin:0 0 16px}
    .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(15,23,42,.04)}
    .card h4{margin:8px 0 6px;font-size:18px}.card p{margin:0;color:var(--muted);line-height:1.6}

    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat strong{font-size:28px;display:block}

    .dashboard-shell{display:grid;gap:12px;margin-top:8px}
    .dash-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#f8fafc;padding:9px 12px;border-radius:999px;min-width:280px;flex:1}
    .search input{border:none;background:transparent;outline:none;width:100%;font:inherit}
    .tabs{display:flex;gap:6px;background:#e8eff5;border-radius:999px;padding:5px}
    .tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-weight:700;cursor:pointer}
    .tab.active{background:#dcfce7;color:#15803d}
    .grid4,.main,.grid2{display:grid;gap:12px}.grid4{grid-template-columns:repeat(4,1fr)}.main{grid-template-columns:1.1fr 1.9fr}.grid2{grid-template-columns:repeat(2,1fr)}
    .kpi-h{display:flex;justify-content:space-between;align-items:center}.icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ecfdf5;color:#059669}.k-label{color:var(--muted);font-size:13px;margin:10px 0 0}.k-val{font-size:32px;font-weight:800;margin:4px 0 0}
    .legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;color:var(--muted);font-size:12px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
    .donut{width:190px;height:190px;border-radius:50%;margin:8px auto 14px;background:conic-gradient(#77e0b3 0 35%,#22c55e 35% 60%,#facc15 60% 80%,#a78bfa 80% 100%);display:grid;place-items:center}
    .donut span{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-content:center;text-align:center;font-weight:800}
    .bars{height:206px;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:8px}.bar{background:#d9e3ec;border-radius:10px;margin-bottom:5px}.bcol{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
    .event{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;margin-bottom:8px;font-size:13px}.status{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px}.status.up{background:#dcfce7;color:#15803d}.status.pa{background:#e2e8f0;color:#64748b}

    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#0f172a;color:#e2e8f0;padding:10px 14px;border-radius:999px;font-size:13px;z-index:999}

    @media (max-width:1000px){.hero{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}.stats,.grid4{grid-template-columns:repeat(2,1fr)}.main,.grid2{grid-template-columns:1fr}}
    @media (max-width:700px){.top-in{padding:10px 14px}.shell{padding:14px}.stats,.grid4{grid-template-columns:1fr}.dash-head{flex-direction:column;align-items:stretch}}
  </style>
