<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub2gether — React SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#eff3f6; --panel:#fff; --line:#dbe4ed; --text:#0f172a; --muted:#64748b; --mint:#77e0b3; }
      *{box-sizing:border-box} body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
      .container{max-width:1280px;margin:0 auto;padding:18px}
      .top{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:40}
      .top-in{max-width:1280px;margin:0 auto;padding:10px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
      .brand{font-weight:800;display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:10px;background:#e7fbf2;display:grid;place-items:center;color:#169d6e}
      .search{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:10px 14px}
      .search input{border:none;background:transparent;outline:none;width:100%;font:inherit}
      .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer}
      .hero{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 14px}.hero h1{margin:0;font-size:clamp(26px,3vw,38px)}
      .hero p{margin:5px 0 0;color:var(--muted)} .tabs{display:flex;gap:6px;background:#e8eff5;padding:5px;border-radius:999px}
      .tab{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-weight:700;cursor:pointer}.tab.active{background:#dcfce7;color:#15803d}
      .grid4,.grid3,.grid2,.main{display:grid;gap:14px;margin-bottom:14px}.grid4{grid-template-columns:repeat(4,1fr)}.main{grid-template-columns:1.15fr 2.1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}
      .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(15,23,42,.04)}
      .click{cursor:pointer;transition:.2s}.click:hover{transform:translateY(-2px);box-shadow:0 18px 30px rgba(15,23,42,.09)}
      .kpi-h{display:flex;justify-content:space-between;align-items:center}.icon{width:38px;height:38px;border-radius:50%;background:#ecfdf5;color:#059669;display:grid;place-items:center}
      .k-label{font-size:13px;color:var(--muted);margin:10px 0 0}.k-value{font-size:clamp(26px,2.6vw,34px);font-weight:800;margin:4px 0 0}
      .up{font-size:13px;font-weight:700;color:#0ea56e}.section-title{margin:0 0 12px;font-size:24px}
      .donut{width:210px;height:210px;border-radius:50%;margin:0 auto 14px;background:conic-gradient(#77e0b3 0 35%,#22c55e 35% 60%,#facc15 60% 80%,#a78bfa 80% 100%);display:grid;place-items:center}
      .donut>span{width:138px;height:138px;border-radius:50%;background:#fff;display:grid;place-content:center;text-align:center;font-weight:800;font-size:30px;line-height:1.2}
      .legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;color:var(--muted);font-size:13px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
      .bars{height:220px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end}.bar-wrap{text-align:center;font-size:11px;color:var(--muted);font-weight:700}.bar{border-radius:10px;background:#d9e3ec;margin-bottom:6px}
      .group-t{display:flex;justify-content:space-between;align-items:center}.tag{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px}.green{background:#dcfce7;color:#15803d}.orange{background:#fef3c7;color:#b45309}
      .name{font-size:21px;font-weight:800;margin:10px 0 4px}.desc{margin:0;color:var(--muted);font-size:14px}.meta{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
      .track{height:10px;background:#e7edf3;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#77e0b3,#52ca97)}
      .event{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;margin-bottom:9px}.status{font-size:10px;font-weight:800;padding:6px 8px;border-radius:999px}.past{background:#e2e8f0;color:#64748b}.upcoming{background:#dcfce7;color:#15803d}
      .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f172a;color:#e2e8f0;padding:10px 14px;border-radius:999px;font-size:13px;z-index:120}
      .landing{max-width:980px;margin:72px auto 0;text-align:center}.landing h1{font-size:clamp(32px,6vw,56px);margin:0 0 12px}.landing p{color:var(--muted);font-size:18px;line-height:1.7}
      .cta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.cta a{padding:12px 18px;border-radius:999px;font-weight:700;text-decoration:none}
      .cta .primary{background:#0f172a;color:#dcfce7}.cta .ghost{border:1px solid var(--line);color:#0f172a;background:#fff}
      @media (max-width:1100px){.grid4,.grid3{grid-template-columns:repeat(2,1fr)}.main,.grid2{grid-template-columns:1fr}}
      @media (max-width:760px){.top-in{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.grid4,.grid3{grid-template-columns:1fr}}
    </style>
  </head>
