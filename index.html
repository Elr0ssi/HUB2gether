<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub2gether — Vitrine & Démos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#f3f6f8;--panel:#fff;--line:#dbe4ed;--text:#0f172a;--muted:#64748b;--mint:#77e0b3;--mintDark:#0f9f6c;--violet:#9333ea}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}a{text-decoration:none;color:inherit}
    .top{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .top-inner{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:34px;height:34px;border-radius:10px;background:#e7fbf2;color:var(--mintDark);display:grid;place-items:center}
    .top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
    .btn.primary{background:#111827;color:#d1fae5;border-color:#111827}.btn.mint{background:#77e0b3;color:#0f2e22;border-color:#77e0b3}
    .shell{max-width:1240px;margin:0 auto;padding:22px 18px}
    .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;padding:40px 0}
    .kicker{display:inline-flex;background:#dcfce7;color:#0f9f6c;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
    h1{font-size:clamp(32px,5.8vw,62px);margin:14px 0;line-height:1.02;letter-spacing:-.03em}.hero p{font-size:18px;line-height:1.7;color:var(--muted);margin:0}
    .hero-cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
    .highlight{background:linear-gradient(160deg,#0f172a,#1e293b);border:1px solid #1f2937;border-radius:24px;padding:20px;color:#dbeafe;box-shadow:0 20px 50px rgba(15,23,42,.2)}
    .highlight h3{color:#86efac;margin:0 0 10px}.pill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pill{padding:10px;border-radius:12px;border:1px solid rgba(219,234,254,.25);font-size:13px}
    .section-title{font-size:30px;letter-spacing:-.02em;margin:8px 0 8px}.section-sub{margin:0 0 16px;color:var(--muted)}
    .grid3,.grid4,.grid2{display:grid;gap:12px}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(15,23,42,.04)}
    .card h4{margin:4px 0 6px;font-size:18px}.card p{margin:0;color:var(--muted);line-height:1.6}
    .kpi strong{display:block;font-size:30px}

    .demo-card{display:flex;flex-direction:column;gap:10px;min-height:170px}.badge{display:inline-block;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:#ede9fe;color:#6d28d9;width:max-content}
    .demo-card a{margin-top:auto;width:max-content}

    .demo-view .mini-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .mini-pill{font-size:12px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#475569}
    .table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e6edf3;text-align:left;font-size:14px}.table th{font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
    .progress{height:10px;background:#e8eef3;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:#77e0b3}
    .match-card{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;margin-bottom:10px}
    .profile-head{display:flex;gap:14px;align-items:center}.avatar{width:82px;height:82px;border-radius:14px;background:linear-gradient(160deg,#cbd5e1,#94a3b8)}

    .footer{margin-top:20px;color:#94a3b8;font-size:13px;text-align:center}
    @media(max-width:1000px){.hero,.grid3,.grid4,.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, { useMemo, useState } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
const h = React.createElement;

const NAV_LINKS = [
  ['Vitrine','./index.html'],
  ['Centre démos','?view=demos'],
  ['Dashboard entreprise','?view=dashboard'],
  ['Expérience joueur','?view=profile']
];

function TopNav(){
  return h('header',{className:'top'},h('div',{className:'top-inner'},
    h('div',{className:'brand'},h('span',{className:'logo'},'✣'),'Hub2gether'),
    h('div',{className:'top-actions'},NAV_LINKS.map(([label,href])=>h('a',{key:label,href,className:'btn'},label)))
  ));
}

function Vitrine(){
  return h('main',{className:'shell'},
    h('section',{className:'hero'},
      h('div',null,
        h('span',{className:'kicker'},'Plateforme sport entreprise'),
        h('h1',null,'Une vraie vitrine produit, claire et orientée valeur.'),
        h('p',null,'On remet la page d’accueil au bon endroit : proposition de valeur, chiffres clés, bénéfices et CTA. Les démos dashboard et expérience joueur sont séparées dans un centre dédié.'),
        h('div',{className:'hero-cta'},
          h('a',{className:'btn primary',href:'?view=demos'},'Voir toutes les démos'),
          h('a',{className:'btn mint',href:'?view=dashboard'},'Démo Dashboard SaaS Entreprise')
        )
      ),
      h('aside',{className:'highlight'},
        h('h3',null,'Chiffres clés 2026'),
        h('div',{className:'pill-grid'},
          h('div',{className:'pill'},'+31% participation collaborateurs'),
          h('div',{className:'pill'},'84% budget sport utilisé'),
          h('div',{className:'pill'},'58 groupes actifs'),
          h('div',{className:'pill'},'4.7/5 satisfaction RH')
        )
      )
    ),
    h('section',null,
      h('h2',{className:'section-title'},'Pourquoi Hub2gether'),
      h('p',{className:'section-sub'},'Moins de complexité, plus d’impact. Pas de doublon d’appellation : nous parlons partout de Dashboard SaaS Entreprise et d’Expérience Joueur.'),
      h('div',{className:'grid3'},
        h('article',{className:'card'},h('h4',null,'Pilotage RH & Direction'),h('p',null,'Consolidez les KPI d’usage, la participation et le ROI des programmes sport et QVT.')),
        h('article',{className:'card'},h('h4',null,'Animation des communautés'),h('p',null,'Créez des groupes, matchs et challenges sans friction avec une expérience cohérente web/mobile.')),
        h('article',{className:'card'},h('h4',null,'Marque employeur'),h('p',null,'Activez la cohésion et donnez de la visibilité à la culture d’entreprise via des activités sportives mesurées.'))
      )
    ),
    h('section',{style:{marginTop:'14px'}},
      h('h2',{className:'section-title'},'Indicateurs de traction'),
      h('div',{className:'grid4'},
        h('div',{className:'card kpi'},h('strong',null,'+18%'),'rétention collaborateurs'),
        h('div',{className:'card kpi'},h('strong',null,'1 398'),'utilisateurs actifs/an'),
        h('div',{className:'card kpi'},h('strong',null,'96'),'événements inter-entreprises'),
        h('div',{className:'card kpi'},h('strong',null,'12'),'partenaires sport & santé')
      )
    ),
    h('p',{className:'footer'},'© 2026 Hub2gether — Vitrine produit')
  );
}

function DemoCenter(){
  const cards=[
    ['Dashboard SaaS Entreprise','Vue KPI RH + direction (entreprise)','?view=dashboard'],
    ['Classement global joueurs','Comparaison des performances par équipes','?view=ranking'],
    ['Group Management','Gestion des groupes, stats et conversations','?view=groups'],
    ['Matchmaking','Recherche de matchs avec filtres avancés','?view=matchmaking'],
    ['Profil joueur','Activités, défis, badge fair-play','?view=profile']
  ];
  return h('main',{className:'shell'},
    h('h2',{className:'section-title'},'Centre des démos'),
    h('p',{className:'section-sub'},'Les démonstrations sont ici, séparées de la vitrine pour éviter de polluer la page d’accueil.'),
    h('div',{className:'grid3'},cards.map(([t,d,link])=>h('article',{className:'card demo-card',key:t},h('span',{className:'badge'},'DEMO'),h('h4',null,t),h('p',null,d),h('a',{className:'btn primary',href:link},'Ouvrir'))))
  );
}

function DashboardEnterprise(){
  const [period,setPeriod]=useState('monthly');
  const DATA={weekly:['1,182','39','41','5'],monthly:['1,240','42','156','14'],yearly:['1,398','58','1,842','96']}[period];
  return h('main',{className:'shell demo-view'},
    h('div',{className:'mini-nav'},['Entreprise','KPI RH','Budget','Participation'].map(i=>h('span',{className:'mini-pill',key:i},i))),
    h('h2',{className:'section-title'},'Dashboard SaaS Entreprise'),
    h('div',{className:'top-actions',style:{marginBottom:'10px'}},['weekly','monthly','yearly'].map(p=>h('button',{className:'btn'+(period===p?' mint':''),key:p,onClick:()=>setPeriod(p)},p))),
    h('div',{className:'grid4'},[['Employés actifs',DATA[0]],['Groupes sportifs',DATA[1]],['Matchs',DATA[2]],['Events',DATA[3]]].map(([k,v])=>h('div',{className:'card kpi',key:k},h('strong',null,v),k))),
    h('div',{className:'grid2',style:{marginTop:'12px'}},
      h('article',{className:'card'},h('h4',null,'Top Departments Participation'),['Marketing','Sales','Engineering','R&D'].map((n,i)=>h('div',{key:n,style:{marginBottom:'10px'}},h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',marginBottom:'4px'}},h('span',null,n),h('span',null,[82,75,68,64][i]+'%')),h('div',{className:'progress'},h('span',{style:{width:[82,75,68,64][i]+'%'}}))))),
      h('article',{className:'card'},h('h4',null,'Inter-company Events'),['Hub2gether vs Stripe','Hub2gether vs Google','Hub2gether vs Slack'].map((e,idx)=>h('div',{className:'match-card',key:e},h('div',null,e),h('span',{className:'status '+(idx===0?'pa':'up')},idx===0?'past':'upcoming'))))
    )
  );
}

function RankingView(){
  return h('main',{className:'shell demo-view'},h('h2',{className:'section-title'},'Global Player Ranking'),h('p',{className:'section-sub'},'Vue classement joueurs et duel départements.'),
    h('div',{className:'grid2'},
      h('article',{className:'card'},h('table',{className:'table'},h('thead',null,h('tr',null,['Rank','Player','Team','Wins','Points'].map(x=>h('th',{key:x},x)))),h('tbody',null,[['1','Alex Rivera','Sales','45','2450'],['2','Sarah Chen','IT','42','2310'],['3','Marc Dupont','Marketing','38','2100']].map(r=>h('tr',{key:r[0]},r.map((c,i)=>h('td',{key:i},c))))))),
      h('article',{className:'card'},h('h4',null,'Department Showdown'),['Engineering 1420 / Sales 780','Marketing 920 / Product 995','Legal 450 / Finance 1120'].map(x=>{const p=Math.min(90,Math.max(20,parseInt(x.match(/\d+/)[0])/16));return h('div',{style:{marginBottom:'12px'},key:x},h('div',{style:{fontSize:'13px',marginBottom:'4px'}},x),h('div',{className:'progress'},h('span',{style:{width:p+'%'}})));}))
    )
  );
}

function GroupView(){
  return h('main',{className:'shell demo-view'},h('h2',{className:'section-title'},'Group Management — Overview'),
    h('div',{className:'grid2'},
      h('article',{className:'card'},h('h4',null,'Mes groupes'),['Padel Paris','Tech Football','Basketball APAC'].map(g=>h('div',{className:'match-card',key:g},h('div',null,g),h('span',{className:'status up'},'actif')))),
      h('article',{className:'card'},h('h4',null,'Équipes du groupe'),h('table',{className:'table'},h('thead',null,h('tr',null,['Rang','Équipe','Victoires','Statut'].map(x=>h('th',{key:x},x)))),h('tbody',null,[['1','Marc & Julie','75%','Victoire'],['2','Thomas & Sarah','64%','Victoire'],['3','Pierre & Lucas','58%','Défaite']].map((r,i)=>h('tr',{key:i},r.map((c,j)=>h('td',{key:j},c))))))))
    )
  );
}

function MatchmakingView(){
  return h('main',{className:'shell demo-view'},h('h2',{className:'section-title'},'Matchmaking — Expanded Filters'),
    h('div',{className:'grid2'},
      h('article',{className:'card'},h('h4',null,'Filtres'),['Ville: San Francisco','Niveau: Intermediate','Sport: Padel','Distance: 1km → 50km'].map(i=>h('p',{key:i,style:{marginBottom:'8px'}},i))),
      h('article',{className:'card'},h('h4',null,'Active Matches'),['Marketing Dept vs Sales Dept','Internal Friday Football'].map((m,i)=>h('div',{className:'match-card',key:m},h('div',null,m),h('button',{className:'btn '+(i? 'mint':'' )},i?'Join':'Full'))))
    )
  );
}

function ProfileView(){
  return h('main',{className:'shell demo-view'},h('h2',{className:'section-title'},'Profil joueur'),
    h('article',{className:'card profile-head'},h('div',{className:'avatar'}),h('div',null,h('h3',{style:{margin:'0 0 4px'}},'Alex Rivers'),h('p',{className:'section-sub',style:{margin:0}},'Product Design Department • Hub2gether Lyon'))),
    h('div',{className:'grid2',style:{marginTop:'12px'}},
      h('article',{className:'card'},h('h4',null,'Tableau de performance'),h('div',{className:'grid3'},[['Victoires',45],['Ratio', '75%'],['Calories', '12.4k']].map(x=>h('div',{className:'card',key:x[0]},h('strong',null,x[1]),x[0])))),
      h('article',{className:'card'},h('h4',null,'Fair-Play & badges'),['Good Spirit','Competitive'].map(b=>h('div',{className:'match-card',key:b},h('div',null,b),h('span',{className:'status up'},'badge'))))
    )
  );
}

function App(){
  const view = new URLSearchParams(location.search).get('view') || 'vitrine';
  const map = { vitrine:Vitrine, demos:DemoCenter, dashboard:DashboardEnterprise, ranking:RankingView, groups:GroupView, matchmaking:MatchmakingView, profile:ProfileView };
  const Screen = map[view] || Vitrine;
  return h(React.Fragment,null,h(TopNav),h(Screen));
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
